name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax lint
        run: bash scripts/verify-plugin.sh --lint-only

      - name: Forbidden brand check
        run: bash scripts/verify-plugin.sh --brand-check-only

      - name: Build release ZIP
        run: bash scripts/build-zip.sh

      - name: Verify release ZIP
        id: zip_info
        run: |
          VERSION="$(grep -E '^\s*\*\s*Version:' trendplot-connector.php | head -n 1 | sed -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//')"
          ZIP_PATH="${GITHUB_WORKSPACE}/builds/trendplot-connector-${VERSION}.zip"
          if [[ ! -f "${ZIP_PATH}" ]]; then
            echo "ERROR: expected zip not found: ${ZIP_PATH}" >&2
            exit 1
          fi
          echo "ZIP_PATH=${ZIP_PATH}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "OK: ${ZIP_PATH}"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: trendplot-connector-${{ env.VERSION }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Determine prerelease flag
        id: release_meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PRERELEASE=false
          case "${VERSION}" in
            *alpha*|*beta*|*rc*|*dev*)
              PRERELEASE=true
              ;;
          esac
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release notes
        id: release_notes
        run: |
          VERSION="${{ steps.release_meta.outputs.version }}"
          NOTES="docs/RELEASE_NOTES_${VERSION}.md"
          if [[ -f "${NOTES}" ]]; then
            echo "path=${NOTES}" >> "${GITHUB_OUTPUT}"
            echo "use_file=true" >> "${GITHUB_OUTPUT}"
          else
            echo "use_file=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GitHub Release (with notes file)
        if: steps.release_notes.outputs.use_file == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Trendplot Connector ${{ steps.release_meta.outputs.version }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          generate_release_notes: false
          body_path: ${{ steps.release_notes.outputs.path }}
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (auto-generated notes)
        if: steps.release_notes.outputs.use_file == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Trendplot Connector ${{ steps.release_meta.outputs.version }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
